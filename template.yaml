AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 64 Squares Strategy - AWS-native RAG advisor using Bedrock Knowledge Bases and S3 Vectors.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://praschess.github.io
  GenerationInferenceProfileId:
    Type: String
    Default: us.amazon.nova-lite-v1:0

Resources:
  KnowledgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}

  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket

  VectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
      IndexName: strategy-index
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine

  BedrockKnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: KnowledgeBaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource: [!Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0']
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt KnowledgeBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub '${KnowledgeBucket.Arn}/*'
              - Effect: Allow
                Action: [s3vectors:GetIndex, s3vectors:PutVectors, s3vectors:GetVectors, s3vectors:DeleteVectors, s3vectors:QueryVectors]
                Resource: !GetAtt VectorIndex.IndexArn
              - Effect: Allow
                Action: [s3vectors:GetVectorBucket, s3vectors:ListIndexes]
                Resource: !GetAtt VectorBucket.VectorBucketArn

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: [VectorIndex, BedrockKnowledgeBaseRole]
    Properties:
      Name: SquaresStrategyKnowledgeBase
      RoleArn: !GetAtt BedrockKnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration: {Dimensions: 1024, EmbeddingDataType: FLOAT32}
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
          IndexArn: !GetAtt VectorIndex.IndexArn
          IndexName: strategy-index

  KnowledgeDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: SquaresStrategyDocuments
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt KnowledgeBucket.Arn
          InclusionPrefixes: [knowledge/]
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration: {MaxTokens: 400, OverlapPercentage: 20}

  AdvisorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 30
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBase
          MODEL_ARN: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${GenerationInferenceProfileId}'
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:RetrieveAndGenerate]
              Resource: '*'
            - Effect: Allow
              Action: [bedrock:Retrieve]
              Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBase}'
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: '*'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref AllowedOrigin]
          AllowMethods: [POST]
          AllowHeaders: [content-type]
          MaxAge: 600

Outputs:
  ChatApiUrl:
    Value: !GetAtt AdvisorFunctionUrl.FunctionUrl
  KnowledgeBucketName:
    Value: !Ref KnowledgeBucket
  KnowledgeBaseId:
    Value: !Ref KnowledgeBase
  DataSourceId:
    Value: !GetAtt KnowledgeDataSource.DataSourceId
